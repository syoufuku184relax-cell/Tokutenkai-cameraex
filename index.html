<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特典会カメラアプリ</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: #000;
            color: #fff;
            margin: 0;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 認識情報（端末ID・グループ名） */
        .header-info {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.85em;
            color: #4ade80;
            font-weight: bold;
        }

        /* カメラエリア：アスペクト比 3:4 固定 */
        #camera-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            aspect-ratio: 3 / 4; /* 3:4に固定 */
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* メンバー選択ボタン（オーバーレイ） */
        #member-bar {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            z-index: 10;
        }

        .member-btn {
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #fff;
            color: #fff;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.85em;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .member-btn.active {
            background: #fff;
            color: #000;
        }

        /* アクションエリア（ファーストビューに収まるようコンパクト化） */
        .controls {
            width: 100%;
            max-width: 380px;
            margin-top: 8px;
            text-align: center;
        }

        .btn-shutter {
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
            font-weight: bold;
            background: #e11d48;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-shutter:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #status-msg {
            margin-top: 4px;
            font-size: 0.8em;
            color: #4ade80;
            min-height: 1.2em;
        }

        /* 撮影ボタンより下：現場用 修正・追加設定パネル */
        .settings-panel {
            width: 100%;
            max-width: 380px;
            margin-top: 20px;
            padding: 12px;
            background: #1c1c1c;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .settings-panel h2 {
            font-size: 0.9em;
            margin: 0 0 10px 0;
            color: #aaa;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }

        .setting-item {
            margin-bottom: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .setting-item label {
            font-size: 0.8em;
            color: #ccc;
            width: 70px;
            flex-shrink: 0;
        }

        .setting-item input, .setting-item select {
            flex: 1;
            background: #000;
            color: #fff;
            border: 1px solid #444;
            padding: 6px;
            border-radius: 4px;
            font-size: 0.85em;
        }

        .btn-quick-add {
            background: #059669;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 日付・識別情報（端末ID/グループ名） -->
    <div class="header-info">
        <span id="display-term">端末: --</span>
        <span id="display-group">グループ: --</span>
    </div>

    <!-- 3:4 カメラ表示部 -->
    <div id="camera-container">
        <video id="webcam" autoplay playsinline></video>
        <div id="member-bar"></div>
    </div>

    <!-- 撮影ボタン（1画面内に収まる設計） -->
    <div class="controls">
        <button id="shutter-btn" class="btn-shutter" onclick="takePhoto()">撮影</button>
        <div id="status-msg"></div>
    </div>

    <!-- 撮影ボタン下に配置：現場での急な修正・追加パネル -->
    <div class="settings-panel">
        <h2>現場用 簡易設定・追加</h2>
        
        <div class="setting-item">
            <label>グループ名</label>
            <input type="text" id="input-group-name" placeholder="グループ名変更">
            <button class="btn-quick-add" onclick="updateGroup()">変更</button>
        </div>

        <div class="setting-item">
            <label>メンバー追加</label>
            <input type="text" id="quick-mem-name" placeholder="名前" style="flex:2;">
            <input type="color" id="quick-mem-color" value="#FF0000" style="flex:1; height:31px; padding:0; cursor:pointer;">
            <button class="btn-quick-add" onclick="addMemberQuick()">追加</button>
        </div>
    </div>

    <canvas id="capture-canvas" style="display:none;"></canvas>

    <script>
        // 【固定値】Cloudinary設定
        const CLOUD_NAME = "YOUR_CLOUD_NAME"; 
        const UPLOAD_PRESET = "YOUR_UPLOAD_PRESET"; 

        let members = [];
        let selectedMember = null;
        let currentStream = null;

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            
            // 端末ID・グループ名の取得と表示
            const term = params.get('term') || 'A';
            const group = params.get('group') || new Date().toISOString().slice(0,10).replace(/-/g,'');
            
            document.getElementById('display-term').innerText = `端末: ${term}`;
            document.getElementById('display-group').innerText = `グループ: ${group}`;
            document.getElementById('input-group-name').value = group;

            // URLパラメータからメンバーリストを取得（復元処理）
            const rawMembers = params.getAll('member');
            rawMembers.forEach(raw => {
                const parts = raw.split(':');
                if (parts[0]) {
                    const name = parts[0];
                    const color = parts[1] ? parts[1].replace('#', '') : 'FFFFFF';
                    members.push({ name, color });
                }
            });

            renderMemberButtons();
            startRearCamera();
        });

        // メンバーボタンのレンダリング
        function renderMemberButtons() {
            const memberBar = document.getElementById('member-bar');
            memberBar.innerHTML = '';

            members.forEach((m, index) => {
                const btn = document.createElement('button');
                btn.className = 'member-btn';
                btn.innerText = m.name;
                btn.style.borderColor = `#${m.color}`;
                btn.onclick = () => selectMember(btn, m);
                
                memberBar.appendChild(btn);

                // 最初のメンバーを自動選択
                if (index === 0 || (selectedMember && selectedMember.name === m.name)) {
                    selectMember(btn, m);
                }
            });
        }

        function selectMember(btnElement, memberData) {
            document.querySelectorAll('.member-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            selectedMember = memberData;
        }

        // 外カメラ直接起動 (3:4の縦長比率に適用)
        async function startRearCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: "environment",
                    width: { ideal: 1080 },
                    height: { ideal: 1440 } // 3:4 アスペクト比
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('webcam').srcObject = currentStream;
            } catch (err) {
                showStatus('外カメラ起動失敗: ' + err.message, true);
            }
        }

        // 3:4アスペクト比でトリミング＆撮影
        async function takePhoto() {
            const shutterBtn = document.getElementById('shutter-btn');
            shutterBtn.disabled = true;
            showStatus('撮影・処理中...');

            try {
                const video = document.getElementById('webcam');
                const canvas = document.getElementById('capture-canvas');
                
                // 3:4 比率でCanvas解像度を決定（例: 1080x1440px）
                const targetWidth = 1080;
                const targetHeight = 1440;
                canvas.width = targetWidth;
                canvas.height = targetHeight;

                const ctx = canvas.getContext('2d');
                
                // ビデオの現在の表示比率に合わせて中央トリミングして描写
                const vWidth = video.videoWidth;
                const vHeight = video.videoHeight;
                
                let sWidth = vWidth;
                let sHeight = vWidth * (4 / 3);
                
                if (sHeight > vHeight) {
                    sHeight = vHeight;
                    sWidth = vHeight * (3 / 4);
                }

                const sx = (vWidth - sWidth) / 2;
                const sy = (vHeight - sHeight) / 2;

                ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, targetWidth, targetHeight);

                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        showStatus('画像生成エラー', true);
                        shutterBtn.disabled = false;
                        return;
                    }
                    await uploadToCloudinary(blob);
                    shutterBtn.disabled = false;
                }, 'image/jpeg', 0.92);

            } catch (err) {
                showStatus('撮影エラー: ' + err.message, true);
                shutterBtn.disabled = false;
            }
        }

        // 急な現場用：グループ名更新
        function updateGroup() {
            const newGroup = document.getElementById('input-group-name').value;
            if(!newGroup) return;
            document.getElementById('display-group').innerText = `グループ: ${newGroup}`;
            showStatus('グループ名を修正しました');
        }

        // 急な現場用：メンバー追加
        function addMemberQuick() {
            const name = document.getElementById('quick-mem-name').value;
            const color = document.getElementById('quick-mem-color').value.replace('#', '');
            if(!name) return;

            members.push({ name, color });
            renderMemberButtons();
            
            document.getElementById('quick-mem-name').value = '';
            showStatus(`${name} を追加しました`);
        }

        async function uploadToCloudinary(blob) {
            if (!CLOUD_NAME || CLOUD_NAME === "YOUR_CLOUD_NAME") {
                showStatus('撮影完了（保存設定スキップ）');
                return;
            }

            const currentGroup = document.getElementById('display-group').innerText.replace('グループ: ', '');

            const formData = new FormData();
            formData.append('file', blob);
            formData.append('upload_preset', UPLOAD_PRESET);
            
            // タグにグループ名と選択メンバーを紐付け
            let tags = [`group_${currentGroup}`];
            if (selectedMember) {
                tags.push(`member_${selectedMember.name}`);
            }
            formData.append('tags', tags.join(','));

            try {
                showStatus('保存中...');
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    showStatus('保存が完了しました');
                } else {
                    const errData = await response.json();
                    showStatus('送信失敗: ' + (errData.error?.message || 'エラー'), true);
                }
            } catch (err) {
                showStatus('通信エラー: ' + err.message, true);
            }
        }

        function showStatus(msg, isError = false) {
            const statusDiv = document.getElementById('status-msg');
            statusDiv.innerText = msg;
            statusDiv.style.color = isError ? '#f87171' : '#4ade80';
        }
    </script>
</body>
</html>
