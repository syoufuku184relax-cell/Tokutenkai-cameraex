<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特典会カメラアプリ</title>
    <style>
        body {
            font-family: sans-serif;
            background: #000;
            color: #fff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-info {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #aaa;
        }

        /* 撮影エリア */
        #camera-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            display: block;
            background: #222;
        }

        /* メンバー選択ボタンオーバーレイ */
        #member-bar {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .member-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #fff;
            color: #fff;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .member-btn.active {
            background: #fff;
            color: #000;
        }

        /* アクションエリア */
        .controls {
            width: 100%;
            max-width: 500px;
            margin-top: 15px;
            text-align: center;
        }

        .btn-shutter {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
            background: #e11d48;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-shutter:disabled {
            background: #555;
            cursor: not-allowed;
        }

        /* 撮影ボタンより下へ移動した設定パネル */
        .settings-panel {
            width: 100%;
            max-width: 500px;
            margin-top: 30px;
            padding: 15px;
            background: #1e1e1e;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .settings-panel h2 {
            font-size: 1em;
            margin-top: 0;
            margin-bottom: 12px;
            color: #888;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .setting-item {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-item label {
            font-size: 0.85em;
            color: #ccc;
        }

        .setting-item select {
            background: #000;
            color: #fff;
            border: 1px solid #444;
            padding: 6px;
            border-radius: 4px;
            width: 60%;
        }

        #status-msg {
            margin-top: 10px;
            font-size: 0.85em;
            color: #4ade80;
            min-height: 1.2em;
        }
    </style>
</head>
<body>

    <div class="header-info">
        <span id="display-term">端末: --</span>
        <span id="display-group">グループ: --</span>
    </div>

    <!-- カメラ表示部 -->
    <div id="camera-container">
        <video id="webcam" autoplay playsinline></video>
        <div id="member-bar"></div>
    </div>

    <!-- 撮影実行アクション -->
    <div class="controls">
        <button id="shutter-btn" class="btn-shutter" onclick="takePhoto()">撮影</button>
        <div id="status-msg"></div>
    </div>

    <!-- 撮影ボタンより下に配置された設定エリア -->
    <div class="settings-panel">
        <h2>カメラ設定</h2>
        
        <div class="setting-item">
            <label for="camera-select">カメラ切り替え</label>
            <select id="camera-select" onchange="startCamera()"></select>
        </div>

        <div class="setting-item">
            <label for="resolution-select">画質（解像度）</label>
            <select id="resolution-select" onchange="startCamera()">
                <option value="1920x1080" selected>1080p (FHD)</option>
                <option value="1280x720">720p (HD)</option>
                <option value="640x480">480p (SD)</option>
            </select>
        </div>
    </div>

    <!-- 撮影画像処理用非表示Canvas -->
    <canvas id="capture-canvas" style="display:none;"></canvas>

    <script>
        // 【固定設定】Cloudinary設定（画面上からは削除し固定化）
        const CLOUD_NAME = "dfzxluvzy"; 
        const UPLOAD_PRESET = "CheerDream"; 

        let selectedMember = null;
        let currentStream = null;

        // 1. 初期化・URLパラメータ解析（安全化処理追加）
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            
            const term = params.get('term') || '未設定';
            const group = params.get('group') || '未設定';
            
            document.getElementById('display-term').innerText = `端末: ${term}`;
            document.getElementById('display-group').innerText = `グループ: ${group}`;

            // メンバー情報の安全なパース (フリーズ対策)
            const rawMembers = params.getAll('member');
            const memberBar = document.getElementById('member-bar');
            
            rawMembers.forEach((raw, index) => {
                try {
                    const [name, colorHex] = raw.split(':');
                    if (!name) return;

                    // カラーコードの清掃（#の重複除去とフォールバック）
                    const cleanColor = colorHex ? colorHex.replace('#', '').trim() : 'FFFFFF';
                    
                    const btn = document.createElement('button');
                    btn.className = 'member-btn';
                    btn.innerText = name;
                    btn.style.borderColor = `#${cleanColor}`;
                    btn.onclick = () => selectMember(btn, { name, color: cleanColor });
                    
                    memberBar.appendChild(btn);

                    // 最初のメンバーを初期選択
                    if (index === 0) selectMember(btn, { name, color: cleanColor });
                } catch (e) {
                    console.error("メンバーパラメータ解析エラー:", e);
                }
            });

            // 利用可能なデバイス（カメラ）を取得
            getCameras();
        });

        function selectMember(btnElement, memberData) {
            document.querySelectorAll('.member-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            selectedMember = memberData;
        }

        // 2. カメラデバイス一覧の取得と起動
        async function getCameras() {
            try {
                // カメラアクセスの許可を取得
                await navigator.mediaDevices.getUserMedia({ video: true });
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                
                const cameraSelect = document.getElementById('camera-select');
                cameraSelect.innerHTML = '';
                
                videoDevices.forEach((device, i) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `カメラ ${i + 1}`;
                    cameraSelect.appendChild(option);
                });

                startCamera();
            } catch (err) {
                showStatus('カメラのアクセス許可が必要です: ' + err.message, true);
            }
        }

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const deviceId = document.getElementById('camera-select').value;
            const [width, height] = document.getElementById('resolution-select').value.split('x').map(Number);

            const constraints = {
                video: {
                    deviceId: deviceId ? { exact: deviceId } : undefined,
                    width: { ideal: width },
                    height: { ideal: height }
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('webcam').srcObject = currentStream;
            } catch (err) {
                showStatus('カメラ起動失敗: ' + err.message, true);
            }
        }

        // 3. 撮影処理と自動アップロード
        async function takePhoto() {
            const shutterBtn = document.getElementById('shutter-btn');
            shutterBtn.disabled = true;
            showStatus('撮影・処理中...');

            try {
                const video = document.getElementById('webcam');
                const canvas = document.getElementById('capture-canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Blob形式に変換
                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        showStatus('画像生成エラー', true);
                        shutterBtn.disabled = false;
                        return;
                    }
                    await uploadToCloudinary(blob);
                    shutterBtn.disabled = false;
                }, 'image/jpeg', 0.95);

            } catch (err) {
                showStatus('撮影エラー: ' + err.message, true);
                shutterBtn.disabled = false;
            }
        }

        async function uploadToCloudinary(blob) {
            if (!CLOUD_NAME || CLOUD_NAME === "YOUR_CLOUD_NAME") {
                showStatus('保存完了（Cloudinary設定未完了のためスキップ）');
                return;
            }

            const formData = new FormData();
            formData.append('file', blob);
            formData.append('upload_preset', UPLOAD_PRESET);
            
            // 検索・識別用タグの設定
            if (selectedMember) {
                formData.append('tags', `member_${selectedMember.name}`);
            }

            try {
                showStatus('クラウドへ保存中...');
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    showStatus('保存が成功しました！');
                } else {
                    const errData = await response.json();
                    showStatus('送信失敗: ' + (errData.error?.message || 'エラー'), true);
                }
            } catch (err) {
                showStatus('通信エラー: ' + err.message, true);
            }
        }

        function showStatus(msg, isError = false) {
            const statusDiv = document.getElementById('status-msg');
            statusDiv.innerText = msg;
            statusDiv.style.color = isError ? '#f87171' : '#4ade80';
        }
    </script>
</body>
</html>
