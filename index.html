<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特典会カメラ</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 10px; }
        video, img, canvas { width: 100%; max-width: 500px; display: block; margin: 10px auto; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; }
    </style>
</head>
<body>
    <h3>特典会カメラ（撮影時自動保存）</h3>
    <video id="video" autoplay playsinline></video>
    <button id="snap">撮影して保存</button>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const snap = document.getElementById('snap');

        // カメラ起動
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => { video.srcObject = stream; });

        // 撮影ボタンの動作
        snap.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // 日付を合成（簡易的）
            ctx.font = "40px Arial";
            ctx.fillStyle = "white";
            ctx.fillText(new Date().toLocaleString(), 20, 50);

            // 自動ダウンロード処理
            const dataUrl = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'tokuten-photo-' + Date.now() + '.png';
            link.href = dataUrl;
            link.click();
        });
    </script>
</body>
</html>
