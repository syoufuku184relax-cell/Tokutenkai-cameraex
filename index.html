<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特典会カメラ</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        #preview-area { 
            position: relative; width: 100%; margin-bottom: 15px; overflow: hidden; border-radius: 12px; background: #000; 
            border: 4px solid #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            transition: border-color 0.3s, box-shadow 0.3s; box-sizing: border-box;
        }
        video { width: 100%; display: block; }
        #overlay-info { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0, 0, 0, 0.6); padding: 8px 0; display: flex; justify-content: space-around; font-size: 14px; font-weight: bold; color: #fff; }
        
        .select-wrapper { margin-bottom: 15px; text-align: left; }
        .select-header { display: flex; gap: 8px; margin-top: 5px; }
        select { flex: 1; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; }
        
        .btn-settings { width: auto; padding: 0 15px; font-size: 14px; background: #374151; box-shadow: none; }
        .settings-panel { display: none; background: #1e1e1e; padding: 15px; border-radius: 8px; margin-top: 10px; border: 1px solid #333; text-align: left; }
        .add-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
        .add-row input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #121212; color: #fff; font-size: 14px; }
        .add-row input[type="color"] { width: 40px; height: 38px; border: none; border-radius: 6px; cursor: pointer; background: transparent; }
        .btn-add { width: auto; padding: 10px 15px; font-size: 14px; background: #16a34a; box-shadow: none; }
        .idol-list { list-style: none; padding: 0; margin: 0; max-height: 180px; overflow-y: auto; }
        .idol-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #333; font-size: 14px; }
        .idol-item-left { display: flex; align-items: center; gap: 8px; }
        .color-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,0.3); }
        .btn-delete { width: auto; padding: 4px 10px; font-size: 12px; background: #dc2626; box-shadow: none; border-radius: 6px; }

        button { width: 100%; padding: 18px; font-size: 20px; font-weight: bold; color: #fff; background: #2563eb; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button:active { opacity: 0.8; transform: scale(0.98); }
        canvas { display: none; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
        .modal-content { background: #1e1e1e; padding: 15px; border-radius: 12px; max-width: 480px; width: 100%; text-align: center; }
        .modal-content img { width: 100%; border-radius: 8px; margin-bottom: 15px; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .btn-print-save { background: #059669; padding: 20px; font-size: 18px; }
        .btn-close { background: #4b5563; padding: 15px; }

        #print-area { display: none; }
        @media print {
            body > * { display: none !important; }
            #print-area { display: block !important; width: 100%; text-align: center; }
            #print-area img { width: 100%; max-width: 100%; height: auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>特典会カメラ</h2>
        
        <div class="select-wrapper">
            <label for="idol-select">担当アイドルを選択:</label>
            <div class="select-header">
                <select id="idol-select"></select>
                <button id="toggle-settings" type="button" class="btn-settings">⚙ 管理</button>
            </div>
            <div id="settings-panel" class="settings-panel">
                <div style="font-weight: bold; margin-bottom: 8px; font-size: 14px;">メンバーとカラーの追加・削除</div>
                <div class="add-row">
                    <input type="text" id="new-idol-input" placeholder="名前">
                    <input type="color" id="new-idol-color" value="#ef4444" title="メンバーカラー">
                    <button type="button" id="add-idol-btn" class="btn-add">追加</button>
                </div>
                <ul id="idol-list-ui" class="idol-list"></ul>
            </div>
        </div>

        <div id="preview-area">
            <video id="video" autoplay playsinline></video>
            <div id="overlay-info">
                <span id="display-name">----</span>
                <span id="display-date">----/--/--</span>
                <span id="display-code">No. ----</span>
            </div>
        </div>
        <button id="snap">📸 撮影する</button>
        <canvas id="canvas"></canvas>
    </div>

    <div id="modal-preview" class="modal">
        <div class="modal-content">
            <img id="modal-img" src="" alt="撮影画像">
            <div class="modal-actions">
                <button type="button" id="btn-modal-print" class="btn-print-save">🖨 印刷 ＆ 保存</button>
                <button type="button" id="btn-modal-close" class="btn-close">キャンセル</button>
            </div>
        </div>
    </div>

    <div id="print-area">
        <img id="print-img" src="" alt="印刷用">
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const snap = document.getElementById('snap');
        const idolSelect = document.getElementById('idol-select');
        const previewArea = document.getElementById('preview-area');
        const displayName = document.getElementById('display-name');
        const displayDate = document.getElementById('display-date');
        const displayCode = document.getElementById('display-code');

        const toggleSettings = document.getElementById('toggle-settings');
        const settingsPanel = document.getElementById('settings-panel');
        const newIdolInput = document.getElementById('new-idol-input');
        const newIdolColor = document.getElementById('new-idol-color');
        const addIdolBtn = document.getElementById('add-idol-btn');
        const idolListUi = document.getElementById('idol-list-ui');

        const modalPreview = document.getElementById('modal-preview');
        const modalImg = document.getElementById('modal-img');
        const printImg = document.getElementById('print-img');
        const btnModalPrint = document.getElementById('btn-modal-print');
        const btnModalClose = document.getElementById('btn-modal-close');

        const defaultIdols = [
            { name: "アイドル A", color: "#ef4444" },
            { name: "アイドル B", color: "#3b82f6" },
            { name: "アイドル C", color: "#a855f7" }
        ];

        let idols = JSON.parse(localStorage.getItem('tokuten_idols')) || defaultIdols;
        let savedDateStr = "";
        let currentCode = "";
        let lastCapturedDataUrl = "";
        const usedCodes = new Set();

        function applyMemberColor() {
            const selected = idols.find(i => i.name === idolSelect.value);
            const color = selected ? selected.color : '#2563eb';
            previewArea.style.borderColor = color;
            previewArea.style.boxShadow = `0 0 15px ${color}aa`;
        }

        function saveAndRenderIdols() {
            localStorage.setItem('tokuten_idols', JSON.stringify(idols));
            const currentSelected = idolSelect.value;
            idolSelect.innerHTML = "";
            idols.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.name; opt.textContent = item.name;
                idolSelect.appendChild(opt);
            });
            if (idols.some(i => i.name === currentSelected)) idolSelect.value = currentSelected;

            idolListUi.innerHTML = "";
            idols.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = "idol-item";
                li.innerHTML = `<div class="idol-item-left"><span class="color-dot" style="background-color: ${item.color}"></span><span>${item.name}</span></div><button type="button" class="btn-delete" onclick="removeIdol(${index})">削除</button>`;
                idolListUi.appendChild(li);
            });
            updateDisplayInfo();
        }

        addIdolBtn.addEventListener('click', () => {
            const name = newIdolInput.value.trim();
            const color = newIdolColor.value;
            if (name && !idols.some(i => i.name === name)) {
                idols.push({ name, color });
                newIdolInput.value = "";
                saveAndRenderIdols();
                idolSelect.value = name;
                applyMemberColor();
            }
        });

        window.removeIdol = function(index) {
            idols.splice(index, 1);
            saveAndRenderIdols();
            applyMemberColor();
        };

        toggleSettings.addEventListener('click', () => {
            settingsPanel.style.display = settingsPanel.style.display === "block" ? "none" : "block";
        });

        function generateUniqueCode() {
            const chars = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
            let code = "";
            for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        function updateDisplayInfo() {
            const now = new Date();
            savedDateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
            currentCode = generateUniqueCode();
            displayName.textContent = idolSelect.value || "----";
            displayDate.textContent = savedDateStr;
            displayCode.textContent = `No. ${currentCode}`;
        }

        idolSelect.addEventListener('change', () => { updateDisplayInfo(); applyMemberColor(); });

        saveAndRenderIdols();
        applyMemberColor();

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(() => {
                navigator.mediaDevices.getUserMedia({ video: true }).then(stream => { video.srcObject = stream; });
            });

        snap.addEventListener('click', () => {
            if (!video.videoWidth) return;
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const boxHeight = canvas.height * 0.08;
            ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
            ctx.fillRect(0, canvas.height - boxHeight, canvas.width, boxHeight);
            const fontSize = Math.floor(canvas.width * 0.035);
            ctx.font = `bold ${fontSize}px sans-serif`; ctx.fillStyle = "#ffffff"; ctx.textBaseline = "middle";
            ctx.textAlign = "left"; ctx.fillText(idolSelect.value, fontSize * 1.5, canvas.height - (boxHeight / 2));
            ctx.textAlign = "center"; ctx.fillText(savedDateStr, canvas.width / 2, canvas.height - (boxHeight / 2));
            ctx.textAlign = "right"; ctx.fillText(`No. ${currentCode}`, canvas.width - (fontSize * 1.5), canvas.height - (boxHeight / 2));

            lastCapturedDataUrl = canvas.toDataURL('image/png');
            modalImg.src = lastCapturedDataUrl;
            printImg.src = lastCapturedDataUrl;
            modalPreview.style.display = "flex";
        });

        // 印刷ボタン：保存と印刷を同時に実行
        btnModalPrint.addEventListener('click', () => {
            const currentName = idolSelect.value || "";
            const link = document.createElement('a');
            link.download = `tokuten_${currentName}_${savedDateStr.replace(/\//g, '')}_${currentCode}.png`;
            link.href = lastCapturedDataUrl;
            link.click();
            
            window.print();
            
            modalPreview.style.display = "none";
            updateDisplayInfo();
        });

        btnModalClose.addEventListener('click', () => { modalPreview.style.display = "none"; });
    </script>
</body>
</html>
