<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特典会カメラ</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; }
        #preview-area { position: relative; width: 100%; margin-bottom: 15px; overflow: hidden; border-radius: 12px; background: #000; }
        video { width: 100%; display: block; }
        #overlay-info { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0, 0, 0, 0.6); padding: 10px 0; display: flex; justify-content: space-around; font-size: 14px; font-weight: bold; color: #fff; }
        button { width: 100%; padding: 18px; font-size: 20px; font-weight: bold; color: #fff; background: #2563eb; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button:active { background: #1d4ed8; transform: scale(0.98); }
        canvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>特典会カメラ</h2>
        <div id="preview-area">
            <video id="video" autoplay playsinline></video>
            <div id="overlay-info">
                <span id="display-date">----/--/--</span>
                <span id="display-code">No. ----</span>
            </div>
        </div>
        <button id="snap">📸 撮影して自動保存</button>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const snap = document.getElementById('snap');
        const displayDate = document.getElementById('display-date');
        const displayCode = document.getElementById('display-code');

        let savedDateStr = "";
        let currentCode = "";
        
        // 本日使用済みのコードを保持するリスト（重複防止）
        const usedCodes = new Set();

        // 紛らわしい文字(0, O, 1, I)を除いた4桁コード生成関数
        function generateUniqueCode() {
            const chars = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
            let code = "";
            let attempts = 0;
            
            // 未使用のコードが生成されるまでループ
            do {
                code = "";
                for (let i = 0; i < 4; i++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                attempts++;
            } while (usedCodes.has(code) && attempts < 1000);

            usedCodes.add(code);
            return code;
        }

        // 画面の「日付」と「認識番号」を最新化する処理
        function updateDisplayInfo() {
            const now = new Date();
            savedDateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
            currentCode = generateUniqueCode();

            displayDate.textContent = savedDateStr;
            displayCode.textContent = `No. ${currentCode}`;
        }

        // 初期化（1枚目のコードを用意）
        updateDisplayInfo();

        // カメラ起動
        navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" } 
        }).then(stream => {
            video.srcObject = stream;
        }).catch(() => {
            navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                video.srcObject = stream;
            }).catch(err => {
                alert('カメラへのアクセス権限が許可されていないか、カメラが見つかりません。');
            });
        });

        // 撮影・印字・保存処理
        snap.addEventListener('click', () => {
            if (!video.videoWidth) return;

            // 1. キャンバス準備
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            // 2. 写真を描画
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 3. 下部の黒帯を描画
            const boxHeight = canvas.height * 0.08;
            ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
            ctx.fillRect(0, canvas.height - boxHeight, canvas.width, boxHeight);

            // 4. 文字印字（現在表示中の日付とコード）
            const fontSize = Math.floor(canvas.width * 0.038);
            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.fillStyle = "#ffffff";
            ctx.textBaseline = "middle";

            ctx.textAlign = "left";
            ctx.fillText(savedDateStr, fontSize, canvas.height - (boxHeight / 2));

            ctx.textAlign = "right";
            ctx.fillText(`No. ${currentCode}`, canvas.width - fontSize, canvas.height - (boxHeight / 2));

            // 5. 保存実行
            const link = document.createElement('a');
            link.download = `tokuten_${savedDateStr.replace(/\//g, '')}_${currentCode}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();

            // 6. 【重要】保存完了後、次の撮影のために新しいコードを即座に発行！
            updateDisplayInfo();
        });
    </script>
</body>
</html>
