<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特典会カメラアプリ</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 8px 12px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        /* ヘッダー (端末ID / グループ名 / メンバー選択) */
        .header-info { width: 100%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .header-left { font-size: 0.85em; color: #4ade80; font-weight: bold; }
        .member-select-btn { padding: 5px 14px; border-radius: 16px; font-size: 0.85em; font-weight: bold; cursor: pointer; border: 1px solid #fff; transition: background-color 0.2s, color 0.2s; }

        /* カメラプレビュー (3:4) - メンカラの太枠で囲む */
        #camera-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            aspect-ratio: 3 / 4;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            border: 4px solid #2563eb;
            transition: border-color 0.2s ease;
        }

        video, #preview-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        #preview-img { display: none; }

        /* フッター（年月日・認識ID・累計撮影枚数） */
        .footer-info { width: 100%; max-width: 380px; margin-top: 8px; display: flex; justify-content: space-between; font-size: 0.85em; color: #aaa; font-family: monospace; }
        .id-display { color: #fff; font-weight: bold; }

        /* ボタンエリア */
        .controls { width: 100%; max-width: 380px; margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
        .btn { width: 100%; padding: 12px; font-size: 1em; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .btn-shutter { background: #e11d48; color: #fff; }
        .btn-print-save { background: #059669; color: #fff; display: none; }
        .btn-retake { background: #4b5563; color: #fff; display: none; }
        .btn-upload { background: #2563eb; color: #fff; margin-top: 6px; }
        .btn-settings { background: #333; color: #ccc; font-size: 0.85em; padding: 8px; }

        #status-msg { text-align: center; font-size: 0.85em; color: #4ade80; min-height: 1.2em; }
        
        /* モーダル */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e1e1e; width: 90%; max-width: 350px; padding: 16px; border-radius: 12px; border: 1px solid #333; }
        .member-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 250px; overflow-y: auto; }
        .member-grid-btn { border: 2px solid #555; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .modal-close-btn { background: #666; color: #fff; border: none; padding: 8px; width: 100%; border-radius: 6px; margin-top: 12px; cursor: pointer; }

        /* メンバー追加モーダル用 カラーパレット */
        .color-palette { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0 12px 0; max-height: 180px; overflow-y: auto; }
        .color-opt-btn { padding: 8px; border-radius: 6px; border: 2px solid transparent; font-size: 0.75em; font-weight: bold; cursor: pointer; text-align: center; }
        .color-opt-btn.active { border-color: #fff; box-shadow: 0 0 6px #fff; }

        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="header-info">
        <div class="header-left">端末:<span id="display-term">--</span> / G:<span id="display-group">--</span></div>
        <button class="member-select-btn" id="member-btn" onclick="openMemberModal()">メンバー選択</button>
    </div>

    <!-- カメラ枠：選択されたメンカラで囲む（印刷・保存データには含まれません） -->
    <div id="camera-container">
        <video id="webcam" autoplay playsinline></video>
        <img id="preview-img" alt="プレビュー">
    </div>

    <!-- 撮影前から常時表示：年月日 ＋ 認識ID -->
    <div class="footer-info">
        <div><span id="display-date">--/--/--</span> <span class="id-display" id="display-code">ID:--</span></div>
        <div>本日撮影累計: <span id="display-count" style="color:#4ade80; font-weight:bold;">0</span>枚</div>
    </div>

    <div class="controls">
        <div id="status-msg"></div>
        <button id="btn-shutter" class="btn btn-shutter" onclick="takePhoto()">撮影</button>
        <button id="btn-print-save" class="btn btn-print-save" onclick="printAndSave()">印刷＆保存（確定）</button>
        <button id="btn-retake" class="btn btn-retake" onclick="resetToCamera()">撮り直す</button>
        
        <button id="btn-upload" class="btn btn-upload" onclick="triggerBatchUpload()">一括送信（イベント終了後）</button>
        <button class="btn btn-settings" onclick="openSettingsModal()">追加設定</button>
    </div>

    <!-- メンバー選択モーダル -->
    <div id="member-modal" class="modal"><div class="modal-content"><div style="margin-bottom:10px; font-weight:bold;">メンバー選択</div><div class="member-grid" id="member-grid"></div><button class="modal-close-btn" onclick="closeModal('member-modal')">閉じる</button></div></div>
    
    <!-- 現場用 メンバー追加モーダル -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div style="margin-bottom:10px; font-weight:bold;">メンバー追加</div>
            <input type="text" id="input-mem-name" placeholder="メンバー名" style="width:100%; padding:8px; background:#000; color:#fff; border:1px solid #444; border-radius:4px;">
            
            <div style="font-size:0.8em; color:#aaa; margin-top:10px;">メンカラ選択</div>
            <div class="color-palette" id="color-palette"></div>
            
            <div id="custom-color-container" style="display:none; margin-bottom:10px; align-items:center; gap:8px;">
                <span style="font-size:0.8em; color:#aaa;">カスタム色:</span>
                <input type="color" id="input-custom-color" value="#10b981" style="width:100%; height:36px; padding:0; background:none; border:none; cursor:pointer;">
            </div>

            <button class="btn" style="background:#059669;" onclick="saveSettings()">メンバーを追加</button>
            <button class="modal-close-btn" onclick="closeModal('settings-modal')">閉じる</button>
        </div>
    </div>

    <canvas id="capture-canvas" style="display:none;"></canvas>
    <div id="print-area" style="display:none;"><img id="print-img"></div>

    <script>
        const CLOUD_NAME = "dfzxluvzy";
        const UPLOAD_PRESET = "CheerDream";

        // 発行済み認識IDの管理Set（重複防止用）
        const issuedCodes = new Set();

        // メンカラ定義（設定URL発行アプリと統一）
        const PRESET_COLORS = [
            { name: "赤", hex: "e11d48" },
            { name: "青", hex: "2563eb" },
            { name: "黄", hex: "ffff00" },
            { name: "緑", hex: "16a34a" },
            { name: "紫", hex: "ff00ff" },
            { name: "ピンク", hex: "ec4899" },
            { name: "オレンジ", hex: "f97316" },
            { name: "水色", hex: "06b6d4" },
            { name: "白", hex: "ffffff" },
            { name: "エメラルド", hex: "10b981" },
            { name: "カスタム", hex: "custom" }
        ];

        let members = [];
        let selectedMember = null;
        let photoCount = 0;
        let currentCode = "";
        let finalImageBlob = null;
        let photoQueue = [];
        let selectedAddColor = "10b981";

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            document.getElementById('display-term').innerText = params.get('term') || 'E';
            document.getElementById('display-group').innerText = params.get('group') || 'misscarat2-0';
            
            updateDateDisplay();

            const raw = params.getAll('member');
            raw.forEach(r => { const p = r.split(':'); members.push({name: p[0], color: p[1]?.replace('#','')||'2563eb'}); });
            if(members.length === 0) members.push({name:'ran', color:'e11d48'});
            
            selectMember(members[0]);
            generateNewID();
            startRearCamera();
            initColorPalette();
        });

        function updateDateDisplay() {
            const today = new Date();
            const dateStr = `${today.getFullYear()}/${String(today.getMonth()+1).padStart(2,'0')}/${String(today.getDate()).padStart(2,'0')}`;
            document.getElementById('display-date').innerText = dateStr;
            return dateStr;
        }

        // 重複チェック付き認識IDの生成
        function generateNewID() {
            const term = document.getElementById('display-term').innerText;
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let newCode = '';

            do {
                let randomStr = ''; 
                for(let i = 0; i < 4; i++) randomStr += chars.charAt(Math.floor(Math.random() * chars.length));
                newCode = `${term}-${randomStr}`;
            } while (issuedCodes.has(newCode));

            issuedCodes.add(newCode);
            currentCode = newCode;
            document.getElementById('display-code').innerText = `ID:${currentCode}`;
        }

        function startRearCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width:{ideal:1080}, height:{ideal:1440} } })
                .then(stream => document.getElementById('webcam').srcObject = stream)
                .catch(e => showStatus('カメラ起動失敗', true));
        }

        function getContrast(hex) {
            const r = parseInt(hex.substring(0, 2), 16) || 0;
            const g = parseInt(hex.substring(2, 4), 16) || 0;
            const b = parseInt(hex.substring(4, 6), 16) || 0;
            return ((r * 299 + g * 587 + b * 114) / 1000 > 150) ? '#000000' : '#ffffff';
        }

        function selectMember(m) {
            selectedMember = m;
            const btn = document.getElementById('member-btn');
            btn.innerText = m.name;
            btn.style.backgroundColor = `#${m.color}`;
            btn.style.color = getContrast(m.color);
            document.getElementById('camera-container').style.borderColor = `#${m.color}`;
        }

        function initColorPalette() {
            const palette = document.getElementById('color-palette');
            palette.innerHTML = '';

            PRESET_COLORS.forEach((c, index) => {
                const btn = document.createElement('div');
                btn.className = 'color-opt-btn';
                btn.innerText = c.name;
                
                if (c.hex === 'custom') {
                    btn.style.backgroundColor = '#333';
                    btn.style.color = '#fff';
                } else {
                    btn.style.backgroundColor = `#${c.hex}`;
                    btn.style.color = getContrast(c.hex);
                }

                if (index === 0) {
                    btn.classList.add('active');
                    selectedAddColor = c.hex;
                }

                btn.onclick = () => {
                    document.querySelectorAll('.color-opt-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    const customContainer = document.getElementById('custom-color-container');
                    if (c.hex === 'custom') {
                        customContainer.style.display = 'flex';
                        selectedAddColor = document.getElementById('input-custom-color').value.replace('#','');
                    } else {
                        customContainer.style.display = 'none';
                        selectedAddColor = c.hex;
                    }
                };
                palette.appendChild(btn);
            });

            document.getElementById('input-custom-color').addEventListener('input', (e) => {
                selectedAddColor = e.target.value.replace('#','');
            });
        }

        // 1. 撮影（歪み防止のアスペクト比中央クロップ処理付き）
        function takePhoto() {
            const v = document.getElementById('webcam');
            const canvas = document.getElementById('capture-canvas');
            canvas.width = 1080; 
            canvas.height = 1440;
            const ctx = canvas.getContext('2d');
            
            // アスペクト比計算による歪み防止処理
            const vRatio = v.videoWidth / v.videoHeight;
            const targetRatio = 1080 / 1440;
            let sx, sy, sWidth, sHeight;

            if (vRatio > targetRatio) {
                sHeight = v.videoHeight;
                sWidth = v.videoHeight * targetRatio;
                sx = (v.videoWidth - sWidth) / 2;
                sy = 0;
            } else {
                sWidth = v.videoWidth;
                sHeight = v.videoWidth / targetRatio;
                sx = 0;
                sy = (v.videoHeight - sHeight) / 2;
            }
            
            ctx.drawImage(v, sx, sy, sWidth, sHeight, 0, 0, 1080, 1440);

            // 写真下部への文字合成
            const dateStr = updateDateDisplay();
            const codeStr = `ID:${currentCode}`;

            const gradient = ctx.createLinearGradient(0, 1360, 0, 1440);
            gradient.addColorStop(0, 'rgba(0,0,0,0)');
            gradient.addColorStop(1, 'rgba(0,0,0,0.85)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 1360, 0, 1440, 1080, 80);

            ctx.font = 'bold 36px monospace';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(dateStr, 30, 1410);
            ctx.textAlign = 'right';
            ctx.fillText(codeStr, 1050, 1410);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
            document.getElementById('preview-img').src = dataUrl;

            v.style.display = 'none';
            document.getElementById('preview-img').style.display = 'block';
            
            document.getElementById('btn-shutter').style.display = 'none';
            document.getElementById('btn-print-save').style.display = 'block';
            document.getElementById('btn-retake').style.display = 'block';
            document.getElementById('btn-upload').style.display = 'none';

            canvas.toBlob(b => finalImageBlob = b, 'image/jpeg', 0.92);
        }

        function resetToCamera() {
            document.getElementById('webcam').style.display = 'block';
            document.getElementById('preview-img').style.display = 'none';
            
            document.getElementById('btn-shutter').style.display = 'block';
            document.getElementById('btn-print-save').style.display = 'none';
            document.getElementById('btn-retake').style.display = 'none';
            document.getElementById('btn-upload').style.display = 'block';
        }

        // 2. 印刷・保存（確定）
        function printAndSave() {
            if (!finalImageBlob) return;

            photoQueue.push({
                blob: finalImageBlob,
                code: currentCode,
                member: selectedMember ? selectedMember.name : 'unknown'
            });

            photoCount++;
            document.getElementById('display-count').innerText = photoCount;

            document.getElementById('print-img').src = document.getElementById('preview-img').src;
            window.print();

            showStatus(`保存完了 [${currentCode}]`);

            generateNewID();
            resetToCamera();
        }

        // 3. 一括送信（Cloudinaryへ送信・完了時にカウンターリセット）
        async function triggerBatchUpload() {
            if (photoQueue.length === 0) {
                showStatus('送信待ちのデータがありません', true);
                return;
            }

            if (!confirm(`本日撮影した ${photoQueue.length} 枚のデータを一括送信しますか？`)) return;

            showStatus(`送信中 (0/${photoQueue.length})...`);

            let successCount = 0;
            const groupName = document.getElementById('display-group').innerText;

            for (let i = 0; i < photoQueue.length; i++) {
                const item = photoQueue[i];
                const fd = new FormData();
                fd.append('file', item.blob);
                fd.append('upload_preset', UPLOAD_PRESET);
                
                // 日付タグ（date_YYYYMMDD）を追加して一括送信
                const d = new Date();
                const dateTag = `date_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
                fd.append('tags', `group_${groupName},code_${item.code},member_${item.member},${dateTag}`);

                try {
                    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
                    if (res.ok) {
                        successCount++;
                        showStatus(`送信中 (${successCount}/${photoQueue.length})...`);
                    }
                } catch (e) {
                    console.error("送信エラー:", e);
                }
            }

            if (successCount === photoQueue.length) {
                photoQueue = [];
                photoCount = 0;
                document.getElementById('display-count').innerText = photoCount;
                showStatus(`一括送信完了！カウンターを0にリセットしました`);
            } else {
                showStatus(`一部送信失敗: ${successCount}/${photoQueue.length}枚完了`, true);
            }
        }

        function showStatus(msg, err = false) {
            const s = document.getElementById('status-msg');
            s.innerText = msg;
            s.style.color = err ? '#f87171' : '#4ade80';
        }

        function openMemberModal() {
            const g = document.getElementById('member-grid'); g.innerHTML = '';
            members.forEach(m => {
                const b = document.createElement('button');
                b.className = 'member-grid-btn';
                b.innerText = m.name;
                b.style.backgroundColor = `#${m.color}`;
                b.style.color = getContrast(m.color);
                b.onclick = () => { selectMember(m); closeModal('member-modal'); };
                g.appendChild(b);
            });
            document.getElementById('member-modal').style.display = 'flex';
        }

        function openSettingsModal() { document.getElementById('settings-modal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function saveSettings() {
            const n = document.getElementById('input-mem-name').value;
            if (n) {
                const m = { name: n, color: selectedAddColor };
                members.push(m);
                selectMember(m);
                document.getElementById('input-mem-name').value = '';
            }
            closeModal('settings-modal');
        }
    </script>
</body>
</html>
