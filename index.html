<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特典会カメラ・マスター</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: 0 auto; }
        .header-stats { display: flex; justify-content: space-between; padding: 10px; background: #1e1e1e; border-radius: 8px; margin-bottom: 10px; }
        
        #preview-container { position: relative; width: 100%; aspect-ratio: 2/3; overflow: hidden; background: #000; border: 5px solid #444; transition: border-color 0.3s; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .settings-panel { display: none; background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
        input, select { width: 100%; padding: 8px; margin: 5px 0; border-radius: 4px; border: 1px solid #333; background: #000; color: #fff; }
        
        button { width: 100%; padding: 12px; margin-top: 5px; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
        .btn-snap { background: #ef4444; font-size: 20px; padding: 20px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { width: 90%; max-width: 400px; text-align: center; }
        .modal-content img { width: 100%; border: 5px solid #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-stats">
            <div>撮影枚数: <span id="photo-count">0</span></div>
            <div><span id="display-name">---</span></div>
        </div>

        <button onclick="document.getElementById('settings-panel').style.display = (document.getElementById('settings-panel').style.display === 'block' ? 'none' : 'block')">⚙ 設定・管理</button>
        
        <div id="settings-panel" class="settings-panel">
            <strong>1. アイドル/メンカラ管理</strong>
            <input type="text" id="in-name" placeholder="名前">
            <input type="color" id="in-color" value="#ff0000">
            <button onclick="addIdol()" style="background:#059669;">追加</button>
            <select id="idol-select" onchange="updateUI()"></select>
            
            <strong>2. 端末/クラウド設定</strong>
            <input type="text" id="cfg-term" placeholder="端末ID(例: A)">
            <input type="text" id="cfg-cloud" placeholder="Cloud Name">
            <input type="text" id="cfg-preset" placeholder="Preset">
            <button onclick="saveSettings()" style="background:#4b5563;">設定を保存</button>
            <button onclick="document.getElementById('file-picker').click()" style="background:#0891b2;">📂 一括送信</button>
        </div>

        <div id="preview-container" id="border-preview">
            <video id="video" autoplay playsinline></video>
        </div>
        <button class="btn-snap" onclick="snap()">📸 撮影</button>
    </div>

    <!-- モーダル -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <img id="modal-img">
            <button onclick="window.print()" style="background:#2563eb; margin-top:10px;">🖨 印刷 (保存)</button>
            <button onclick="document.getElementById('modal').style.display='none'" style="background:#991b1b;">閉じる</button>
        </div>
    </div>

    <canvas id="canvas" style="display:none"></canvas>
    <input type="file" id="file-picker" multiple accept="image/*" style="display:none">

    <script>
        // データ管理
        let data = JSON.parse(localStorage.getItem('app_data')) || { 
            idols: [], config: {term:'A', cloud:'', preset:''}, count: 0 
        };

        // UI初期化
        function updateUI() {
            const select = document.getElementById('idol-select');
            const name = select.value;
            const idol = data.idols.find(i => i.name === name);
            if(idol) {
                document.getElementById('display-name').textContent = idol.name;
                document.getElementById('preview-container').style.borderColor = idol.color;
            }
            document.getElementById('photo-count').textContent = data.count;
        }

        function saveSettings() {
            data.config = {
                term: document.getElementById('cfg-term').value,
                cloud: document.getElementById('cfg-cloud').value,
                preset: document.getElementById('cfg-preset').value
            };
            localStorage.setItem('app_data', JSON.stringify(data));
            alert('保存しました');
        }

        function addIdol() {
            data.idols.push({ name: document.getElementById('in-name').value, color: document.getElementById('in-color').value });
            localStorage.setItem('app_data', JSON.stringify(data));
            renderSelect();
        }

        function renderSelect() {
            const s = document.getElementById('idol-select');
            s.innerHTML = data.idols.map(i => `<option value="${i.name}">${i.name}</option>`).join('');
            updateUI();
        }

        // カメラ
        async function start() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('video').srcObject = stream;
            } catch(e) { alert("カメラ許可が必要です"); }
        }

        // 撮影処理
        function snap() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600; canvas.height = 900;
            ctx.drawImage(video, 0, 0, 600, 900); // 簡略化して描画
            
            // テキスト焼き付け
            ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(0, 840, 600, 60);
            ctx.fillStyle = "white"; ctx.font = "20px sans-serif";
            const code = Math.floor(1000 + Math.random() * 9000);
            ctx.fillText(`${document.getElementById('idol-select').value} No.${code}-${data.config.term}`, 20, 880);
            
            // 保存・更新
            data.count++;
            localStorage.setItem('app_data', JSON.stringify(data));
            document.getElementById('modal-img').src = canvas.toDataURL();
            document.getElementById('modal').style.display = 'flex';
            updateUI();
        }

        // 一括アップロード
        document.getElementById('file-picker').onchange = (e) => {
            alert('アップロード機能を使用するにはCloudinary設定を確認してください');
        };

        // 起動
        renderSelect();
        start();
    </script>
</body>
</html>
